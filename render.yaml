services:
  - type: web
    name: adhdstudyapp
    env: static
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_CHAT_API_URL
        value: https://luridness-icky-swimmer.ngrok-free.dev/api/chat
